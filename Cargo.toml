[package]
name = "scandesk"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.35"
egui = "0.35"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "rayon"] }
imageproc = "0.27"
mdns-sd = "0.21"
ureq = "3"
rfd = "0.18"
roxmltree = "0.21"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
which = "8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
